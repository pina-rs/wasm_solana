[target.wasm32-unknown-unknown]
runner = 'wasm-bindgen-test-runner'
# `getrandom` 0.3+ requires an explicit backend on wasm32-unknown-unknown.
# The matching `wasm_js` crate features are enabled via target-specific
# dependencies in the crate manifests.
rustflags = [
	"--cfg",
	"getrandom_backend=\"wasm_js\"",
]

[target.wasm32-wasip1]
runner = 'wasm-bindgen-test-runner'
rustflags = [
	"--cfg",
	"getrandom_backend=\"wasm_js\"",
]

[alias]
test_wasm = [
	"test",
	"--target",
	"wasm32-unknown-unknown",
	"--package",
	"wasm_client_solana",
	"-F",
	"js",
	"--",
	"--nocapture",
]
test_streams = [
	"nextest",
	"run",
	"--package",
	"test_utils_solana",
	"-F",
	"test_validator",
]
test_memory_wallet_ssr = [
	"nextest",
	"run",
	"--package",
	"memory_wallet",
	"-F",
	"ssr",
]
test_memory_wallet_docs = [
	"test",
	"--package",
	"memory_wallet",
	"--doc",
	"-F",
	"ssr",
]
test_wasm_client_solana_ssr = [
	"nextest",
	"run",
	"--package",
	"wasm_client_solana",
	"-F",
	"ssr",
]
test_wasm_client_solana_zstd = [
	"nextest",
	"run",
	"--package",
	"wasm_client_solana",
	"-F",
	"zstd",
]
test_wasm_client_solana_docs = [
	"test",
	"--package",
	"wasm_client_solana",
	"--doc",
	"-F",
	"ssr",
]

coverage_streams = [
	"llvm-cov",
	"--no-report",
	"--package",
	"test_utils_solana",
	"-F",
	"test_validator",
]
coverage_memory_wallet_ssr = [
	"llvm-cov",
	"--no-report",
	"--package",
	"memory_wallet",
	"-F",
	"ssr",
]
coverage_memory_wallet_docs = [
	"llvm-cov",
	"--no-report",
	"--package",
	"memory_wallet",
	"--doc",
	"-F",
	"ssr",
]
coverage_wasm_client_solana_ssr = [
	"llvm-cov",
	"--no-report",
	"--package",
	"wasm_client_solana",
	"-F",
	"ssr",
]
# The zstd-gated decode arms only exist in this variant; run both so the
# merged codecov report covers every cfg arm of `decode_account_data`.
coverage_wasm_client_solana_zstd = [
	"llvm-cov",
	"--no-report",
	"--package",
	"wasm_client_solana",
	"-F",
	"zstd",
]
coverage_wasm_client_solana_docs = [
	"llvm-cov",
	"--no-report",
	"--package",
	"wasm_client_solana",
	"--doc",
	"-F",
	"ssr",
]
coverage_codecov_report = [
	"llvm-cov",
	"report",
	"--doctests",
	"--codecov",
	"--output-path",
	"codecov.json",
]
llvm-cov = ["bin", "cargo-llvm-cov"]
nextest = ["bin", "cargo-nextest"]
semver-checks = ["bin", "cargo-semver-checks"]
