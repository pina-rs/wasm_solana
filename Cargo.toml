solana-program-pack = { default-features = false, version = "^3.1" }
solana-program-runtime = { features = ["agave-unstable-api"], default-features = false, version = "^4.2" }
solana-program-test = { features = ["agave-unstable-api"], default-features = false, version = "^4.2" }
solana-pubkey = { default-features = false, features = ["bytemuck", "borsh", "serde"], version = ">=4.2.0, <4.3.0" }
solana-rent = { default-features = false, features = ["serde"], version = ">=4.2.1, <4.4.0" }
solana-reward-info = { default-features = false, features = ["serde"], version = ">=6.2.0, <6.3.0" }
solana-rpc = { features = ["agave-unstable-api"], default-features = false, version = "^4.2" }
solana-sdk-ids = { default-features = false, version = "^3.1" }
solana-signature = { default-features = false, features = ["bytemuck", "serde", "verify"], version = ">=3.4.1, <3.5.0" }
