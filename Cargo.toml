solana-vote-interface = { default-features = false, version = ">=6.0.2, <6.1.0" }
solana-zk-sdk-pod = { default-features = false, version = "^0.1" }
solana-zk-token-sdk = { default-features = false, version = "^3.1" }
spl-associated-token-account-interface = { default-features = false, version = "^2" }
spl-generic-token = { default-features = false, version = "^2" }
spl-memo-interface = { default-features = false, version = "^2.1" }
spl-pod = { default-features = false, version = "^0.7" }
spl-token-2022-interface = { default-features = false, version = "^3.1" }
spl-token-confidential-transfer-proof-extraction = { default-features = false, version = "^0.6" }
spl-token-group-interface = { default-features = false, version = "^0.7" }
spl-token-interface = { default-features = false, version = "^3" }
spl-token-metadata-interface = { default-features = false, version = "^1" }
tarpc = { default-features = false, version = "^0.29" }
tempfile = { default-features = false, version = "^3" }
test-case = { default-features = false, version = "^3" }
test-log = { default-features = false, version = "^0.2" }
thiserror = { default-features = false, version = "^2" }
tokio = { default-features = false, version = "^1" }
typed-builder = { default-features = false, version = "^0.23" }
wallet_standard = { default-features = false, version = "^0.6" }
wasm-bindgen = { default-features = false, version = "^0.2" }
wasm-bindgen-futures = { default-features = false, version = "^0.4" }
wasm-bindgen-test = { default-features = false, version = "^0.3" }
web-sys = { default-features = false, version = "^0.3" }
wincode = { default-features = false, version = "^0.5" }
zstd = { version = "0.13", default-features = false }

solana-blake3-hasher = { default-features = false, version = "^3.1" }
solana-epoch-rewards-hasher = { default-features = false, version = "^3.1" }
solana-keccak-hasher = { default-features = false, version = "^3.1" }

# publishable crates
memory_wallet = { path = "crates/memory_wallet", version = "0.11.2" }
test_utils_insta = { path = "crates/test_utils_insta", version = "0.11.2" }
test_utils_keypairs = { path = "crates/test_utils_keypairs", version = "0.11.2" }
test_utils_solana = { path = "crates/test_utils_solana", version = "0.11.2" }
wasm_client_solana = { path = "crates/wasm_client_solana", version = "0.11.2" }

# forks
solana-account-decoder-client-types-wasm = { path = "forks/solana-account-decoder-client-types-wasm", version = "4.0.2" }
solana-account-decoder-wasm = { path = "forks/solana-account-decoder-wasm", version = "4.0.2" }
solana-transaction-status-client-types-wasm = { path = "forks/solana-transaction-status-client-types-wasm", version = "4.0.2" }
solana-transaction-status-wasm = { path = "forks/solana-transaction-status-wasm", version = "4.0.2" }

[workspace.metadata.bin]
cargo-llvm-cov = { version = "0.9.1" }
cargo-nextest = { version = "0.9.143" }
cargo-semver-checks = { version = "0.50.0" }
wait-for-them = { version = "0.5.1", bins = ["wait-for-them"] }
wasm-bindgen-cli = { version = "0.2.128", bins = ["wasm-bindgen", "wasm-bindgen-test-runner"] }

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.release]
lto = "fat"
overflow-checks = true

[workspace.lints.rust]
# Group lints
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

# Individual lints
unsafe_code = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
edition_2024_expr_fragment_specifier = "allow"

[workspace.lints.clippy]
# Group lints
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Individual lints
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs-in-doc-comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"
