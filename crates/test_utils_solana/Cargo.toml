[package]
name = "test_utils_solana"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = true
readme = "readme.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "Utilities and extensions for testing solana in wasm compatible environments"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, default-features = true }
assert2 = { workspace = true, default-features = true }
async-trait = { workspace = true, default-features = true }
bincode = { workspace = true, default-features = true }
borsh = { workspace = true, features = ["derive"], default-features = true }
chrono-humanize = { workspace = true, default-features = true }
crossbeam-channel = { workspace = true, default-features = true }
derive_more = { workspace = true, features = ["deref", "deref_mut"], default-features = true }
futures = { workspace = true, default-features = true }
log = { workspace = true, default-features = true }
port_check = { workspace = true, default-features = true }
rand = { workspace = true, default-features = true }
send_wrapper = { workspace = true, features = ["futures"], default-features = true }
serde = { workspace = true, features = ["derive"], default-features = true }
serde_json = { workspace = true, default-features = true }
solana-account = { workspace = true, default-features = true }
solana-banks-client = { workspace = true, default-features = true }
solana-banks-interface = { workspace = true, default-features = true }
solana-clock = { workspace = true, default-features = true }
solana-commitment-config = { workspace = true, default-features = true }
solana-epoch-schedule = { workspace = true, default-features = true, optional = true }
solana-faucet = { workspace = true, optional = true, default-features = true, features = ["dev-context-only-utils"] }
solana-keypair = { workspace = true, default-features = true }
solana-loader-v3-interface = { workspace = true, default-features = true }
solana-message = { workspace = true, default-features = true }
solana-native-token = { workspace = true, default-features = true }
solana-program-binaries = { workspace = true, default-features = true }
solana-program-option = { workspace = true, default-features = true }
solana-program-pack = { workspace = true, default-features = true }
solana-program-runtime = { workspace = true, default-features = true }
solana-program-test = { workspace = true, default-features = true }
solana-pubkey = { workspace = true, default-features = true }
solana-rpc = { workspace = true, default-features = true }
solana-sdk-ids = { workspace = true, default-features = true }
solana-signature = { workspace = true, default-features = true }
solana-signer = { workspace = true, default-features = true }
solana-system-interface = { workspace = true, default-features = true }
solana-sysvar = { workspace = true, default-features = true }
solana-test-validator = { workspace = true, optional = true, default-features = true }
solana-transaction = { workspace = true, default-features = true }
spl-associated-token-account-interface = { workspace = true, default-features = true }
spl-token-2022-interface = { workspace = true, default-features = true }
surfpool-sdk = { workspace = true, optional = true, default-features = true }
tarpc = { workspace = true, default-features = true }
tempfile = { workspace = true, default-features = true, optional = true }
typed-builder = { workspace = true, default-features = true }
wallet_standard = { workspace = true, features = ["solana"], default-features = true }
wasm_client_solana = { workspace = true, features = ["ssr"] }

# FIX: these are pinned to keep solana-hash@3 throughout the codebase
solana-blake3-hasher = { workspace = true, default-features = true }
solana-epoch-rewards-hasher = { workspace = true, default-features = true }
solana-keccak-hasher = { workspace = true, default-features = true }

[dev-dependencies]
assert2 = { workspace = true, default-features = true }
futures = { workspace = true, default-features = true }
insta = { workspace = true, features = ["redactions", "json"], default-features = true }
test-log = { workspace = true, features = ["trace"], default-features = true }
test_utils_insta = { workspace = true }
test_utils_keypairs = { workspace = true }
tokio = { workspace = true, features = ["test-util", "time", "full"], default-features = true }

[features]
test_validator = [
	"dep:solana-epoch-schedule",
	"dep:solana-faucet",
	"dep:solana-test-validator",
	"dep:tempfile",
]
# Embed a surfpool node in-process via `surfpool-sdk`. The dependency pulls
# its own agave-4.2-era crate graph (including a second `solana-pubkey`
# major), which is why it stays out of the default feature set: the runner
# only exchanges URLs and base58 strings with it, never types.
surfpool = ["dep:surfpool-sdk"]
