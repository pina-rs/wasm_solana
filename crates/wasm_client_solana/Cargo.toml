[package]
name = "wasm_client_solana"
version = { workspace = true }
authors = { workspace = true }
categories = ["wasm", "web-programming"]
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = true
readme = "readme.md"
repository = { workspace = true }
rust-version = { workspace = true }
# tags = ["solana", "wallet", "web3", "blockchain", "websocket", "rpc", "pubsub"]
description = "A wasm compatible solana rpc and pubsub client"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
async-trait = { workspace = true, default-features = true }
base64 = { workspace = true, default-features = true }
bs58 = { workspace = true, default-features = true }
cfg-if = { workspace = true, default-features = true }
derive_more = { workspace = true, features = ["debug", "deref", "deref_mut", "into", "into_iterator", "from"], default-features = true }
futures = { workspace = true, default-features = true }
futures-timer = { workspace = true, default-features = true }
getrandom = { workspace = true, default-features = true }
gloo-net = { workspace = true, features = ["websocket"], default-features = true }
js-sys = { workspace = true, default-features = true }
log = { workspace = true, default-features = true }
pin-project = { workspace = true, default-features = true }
reqwest = { workspace = true, optional = true, features = ["json"], default-features = true }
reqwest-websocket = { workspace = true, optional = true, features = ["json"], default-features = true }
semver = { workspace = true, default-features = true }
send_wrapper = { workspace = true, features = ["futures"], default-features = true }
serde = { workspace = true, features = ["derive"], default-features = true }
serde-wasm-bindgen = { workspace = true, default-features = true }
serde_bytes = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
serde_tuple = { workspace = true, default-features = true }
serde_with = { workspace = true, default-features = true }
solana-account = { workspace = true, default-features = true }
solana-account-decoder-client-types = { workspace = true }
solana-account-decoder-wasm = { workspace = true, default-features = true }
solana-address-lookup-table-interface = { workspace = true, default-features = true, features = ["serde"] }
solana-clock = { workspace = true, default-features = true }
solana-commitment-config = { workspace = true, default-features = true, features = ["serde"] }
solana-compute-budget-interface = { workspace = true, default-features = true, features = ["serde"] }
solana-epoch-info = { workspace = true, default-features = true }
solana-epoch-schedule = { workspace = true, default-features = true }
solana-fee-calculator = { workspace = true, default-features = true }
solana-hash = { workspace = true, default-features = true }
solana-inflation = { workspace = true, default-features = true }
solana-instruction = { workspace = true, default-features = true }
solana-message = { workspace = true, default-features = true, features = ["serde"] }
solana-native-token = { workspace = true, default-features = true }
solana-nonce = { workspace = true, default-features = true, features = ["serde"] }
solana-pubkey = { workspace = true, default-features = true }
solana-sdk-ids = { workspace = true, default-features = true }
solana-signature = { workspace = true, default-features = true }
solana-signer = { workspace = true, default-features = true }
solana-system-interface = { workspace = true, default-features = true }
solana-transaction = { workspace = true, default-features = true }
solana-transaction-error = { workspace = true, default-features = true }
solana-transaction-status-client-types = { workspace = true }
solana-transaction-status-wasm = { workspace = true }
solana-version = { workspace = true, default-features = true }
solana-vote-interface = { workspace = true, default-features = true, features = ["bincode", "serde"] }
spl-associated-token-account-interface = { workspace = true, default-features = true }
spl-memo-interface = { workspace = true, default-features = true }
spl-token-2022-interface = { workspace = true, features = ["serde"], default-features = true }
spl-token-group-interface = { workspace = true, default-features = true }
spl-token-interface = { workspace = true, default-features = true }
spl-token-metadata-interface = { workspace = true, default-features = true }
thiserror = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["sync"], default-features = true }
tokio-stream = { workspace = true, default-features = true }
typed-builder = { workspace = true, default-features = true }
wallet_standard = { workspace = true, features = ["solana"], default-features = true }
wasm-bindgen = { workspace = true, default-features = true }
wasm-bindgen-futures = { workspace = true, default-features = true }
web-sys = { workspace = true, features = ["console", "HtmlDocument", "Window", "AbortController", "Request", "RequestInit", "AbortSignal", "Response", "Headers"], default-features = true }
wincode = { workspace = true, default-features = true }
zstd = { workspace = true, optional = true, default-features = true }

[[bench]]
name = "client"
harness = false
required-features = ["ssr"]

[[bench]]
name = "subscription"
harness = false
required-features = ["ssr"]

[dev-dependencies]
anyhow = { workspace = true, default-features = true }
assert2 = { workspace = true, default-features = true }
criterion = { default-features = false, version = "^0.8" }
futures-timeout = { workspace = true, default-features = true }
insta = { workspace = true, features = ["redactions", "json"], default-features = true }
solana-keypair = { workspace = true, default-features = true }
spl-pod = { workspace = true, default-features = true }
test-log = { workspace = true, features = ["trace"], default-features = true }
test_utils_insta = { workspace = true }
test_utils_keypairs = { workspace = true }
tokio = { workspace = true, features = ["test-util", "time"], default-features = true }
wasm-bindgen-test = { workspace = true, default-features = true }

# The pubsub integration tests drive a real in-process validator, which only
# exists natively; the browser test target must never build the validator
# stack, so the dependency is scoped to non-wasm targets.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
test_utils_solana = { workspace = true, features = ["test_validator"] }

[features]
js = ["futures-timer/wasm-bindgen", "getrandom/wasm_js"]
ssr = ["dep:reqwest", "dep:reqwest-websocket", "tokio/rt"]
# `zstd` account data only exists on SSR-style responses; enabling it must
# also arm the upstream client-types decoder, otherwise account data decode
# silently returns `None` for `base64+zstd` accounts.
zstd = [
	"ssr",
	"dep:zstd",
	"solana-account-decoder-client-types/zstd",
	"solana-account-decoder-wasm/zstd",
]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom-04 = { default-features = false, features = ["wasm_js"], package = "getrandom", version = "^0.4" }
